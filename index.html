<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Kavach Omni — a citizen prototype for golden-hour cybercrime intercept. Simulated. Not an official Government of India website." />
    <title>Kavach Omni — Emergency Cybercrime Intercept (Prototype)</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kavach_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
